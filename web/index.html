<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Modern Box House 10x10 - 3D Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Modern Box House 10 x 10 m</h1>
    <p>ลากเมาส์เพื่อหมุน • เลื่อนเพื่อซูม • โมเดลแนวคิดสำหรับ Blender / BIM / BOQ</p>
    <div class="controls">
      <button id="reset">Reset View</button>
      <button id="rotate">Auto Rotate: OFF</button>
      <button id="roof">Hide Roof</button>
      <button id="explode">Exploded View</button>
    </div>
  </header>
  <main>
    <canvas id="view" aria-label="Interactive 3D model of a modern 10 by 10 metre house"></canvas>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
